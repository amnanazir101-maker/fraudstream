# The full system: Kafka, a producer replaying the live stream, the scorer, the scoring API,
# the dashboard and the MLflow UI.
#
#   docker compose up --build
#   dashboard http://localhost:8501   API http://localhost:8000/docs   MLflow http://localhost:5000

x-app: &app
  build: .
  image: fraudstream
  volumes:
    - data:/data

services:
  kafka:
    image: apache/kafka:3.9.0
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw  # any base64-encoded UUID
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  setup:
    <<: *app
    command: sh -c "fraudstream simulate && fraudstream train"

  scorer:
    <<: *app
    command: fraudstream consume --bootstrap kafka:9092
    depends_on:
      kafka: { condition: service_healthy }
      setup: { condition: service_completed_successfully }

  producer:
    <<: *app
    command: fraudstream produce --bootstrap kafka:9092 --day-seconds 4
    depends_on:
      kafka: { condition: service_healthy }
      setup: { condition: service_completed_successfully }

  api:
    <<: *app
    command: fraudstream serve --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    depends_on:
      setup: { condition: service_completed_successfully }

  dashboard:
    <<: *app
    command: streamlit run dashboard.py --server.address 0.0.0.0 --server.port 8501
    ports: ["8501:8501"]

  mlflow:
    <<: *app
    command: mlflow ui --backend-store-uri sqlite:////data/mlflow.db --host 0.0.0.0 --port 5000
    ports: ["5000:5000"]
    depends_on:
      setup: { condition: service_completed_successfully }

volumes:
  data:
